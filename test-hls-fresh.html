<!DOCTYPE html>
<html>
<head>
    <title>HLS Fresh Test</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>HLS Fresh Test - Cache Bypassed</h1>
    <audio id="audio" controls autoplay style="width: 100%;"></audio>
    <div id="logs" style="margin-top: 20px; padding: 20px; background: #f0f0f0; font-family: monospace;"></div>

    <script>
        const audio = document.getElementById('audio');
        const logs = document.getElementById('logs');
        const v = Date.now();

        // Add version to ALL URLs to bypass cache
        const hlsUrl = `https://stage-music-files.s3.ap-south-1.amazonaws.com/hls/113/master.m3u8?v=${v}`;

        function log(msg, color = 'black') {
            const div = document.createElement('div');
            div.style.color = color;
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            logs.appendChild(div);
        }

        log('Testing with cache buster: v=' + v, 'blue');

        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: false,
                xhrSetup: function(xhr, url) {
                    // Add version to every request
                    if (url.indexOf('?') === -1) {
                        xhr.open('GET', url + '?v=' + v, true);
                    }
                }
            });

            hls.loadSource(hlsUrl);
            hls.attachMedia(audio);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                log('✅ Manifest parsed', 'green');
            });

            hls.on(Hls.Events.LEVEL_LOADED, (e, data) => {
                if (data.details.fragments[0]) {
                    log('First segment: ' + data.details.fragments[0].url, 'blue');
                }
            });

            hls.on(Hls.Events.FRAG_LOADED, (e, data) => {
                log('✅ Loaded: ' + data.frag.relurl, 'green');
            });

            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) {
                    log('❌ ERROR: ' + data.details + ' - ' + (data.response ? data.response.url : ''), 'red');
                }
            });

            audio.addEventListener('playing', () => {
                log('▶️ PLAYING!', 'green');
            });
        }
    </script>
</body>
</html>
