<!DOCTYPE html>
<html>
<head>
    <title>HLS Playback Test - Do Lugai</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>HLS Playback Test - Do Lugai (Song ID 113)</h1>

    <audio id="audio" controls style="width: 100%;"></audio>

    <div id="status" style="margin-top: 20px; padding: 20px; background: #f0f0f0; font-family: monospace;">
        <h3>Status:</h3>
        <div id="logs"></div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const logsDiv = document.getElementById('logs');
        const hlsUrl = 'https://stage-music-files.s3.ap-south-1.amazonaws.com/hls/113/master.m3u8';

        function addLog(message, color = 'black') {
            const logEntry = document.createElement('div');
            logEntry.style.color = color;
            logEntry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logsDiv.appendChild(logEntry);
        }

        addLog('🚀 Starting HLS test...', 'blue');
        addLog('📍 Master URL: ' + hlsUrl, 'gray');

        if (Hls.isSupported()) {
            addLog('✅ HLS.js is supported', 'green');

            const hls = new Hls({
                debug: false,
                enableWorker: true
            });

            hls.loadSource(hlsUrl);
            hls.attachMedia(audio);

            hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                addLog('✅ Manifest parsed successfully!', 'green');
                addLog('📊 Quality levels found: ' + data.levels.length, 'blue');
                data.levels.forEach((level, index) => {
                    addLog(`   Level ${index}: ${level.bitrate / 1000}kbps`, 'gray');
                });
                addLog('▶️ Ready to play!', 'green');
            });

            hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
                const level = hls.levels[data.level];
                addLog('📊 Switched to quality: ' + level.bitrate / 1000 + 'kbps', 'purple');
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    addLog('❌ FATAL ERROR: ' + data.type + ' - ' + data.details, 'red');
                    if (data.response) {
                        addLog('   Response code: ' + data.response.code, 'red');
                        addLog('   Response URL: ' + data.response.url, 'red');
                    }
                    if (data.frag) {
                        addLog('   Fragment URL: ' + data.frag.url, 'red');
                    }
                } else {
                    addLog('⚠️ Warning: ' + data.type + ' - ' + data.details, 'orange');
                    if (data.response) {
                        addLog('   Response code: ' + data.response.code, 'orange');
                        addLog('   Failed URL: ' + data.response.url, 'orange');
                    }
                    if (data.frag) {
                        addLog('   Fragment: ' + data.frag.relurl, 'orange');
                    }
                }
            });

            hls.on(Hls.Events.FRAG_LOADED, (event, data) => {
                addLog('📦 Loaded segment: ' + data.frag.relurl, 'gray');
            });

            audio.addEventListener('playing', () => {
                addLog('▶️ Playback started!', 'green');
            });

            audio.addEventListener('error', (e) => {
                addLog('❌ Audio error: ' + e.message, 'red');
            });

        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            addLog('✅ Native HLS support (Safari)', 'green');
            audio.src = hlsUrl;
        } else {
            addLog('❌ HLS not supported in this browser', 'red');
        }
    </script>
</body>
</html>
